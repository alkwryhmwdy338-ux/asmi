<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="account"><span class="face"></span><span class="badge">8</span></div>
      <div class="address"><span class="coin blue">C</span><b>0xfK07...8336</b><span class="chevron">⌄</span></div>
      <button class="wallet" aria-label="Wallet">▣<small>●</small></button>
    </header>

    <div class="tools"><button aria-label="Zoom out">⌕</button><button aria-label="Close">×</button></div>
    <h1>Swap</h1>

    <section class="swap-card">
      <div class="label-line"><span>You Pay</span><span class="balance">▣ 52.34 BNB <b>Max</b></span></div>
      <div class="token-line">
        <div class="token"><span class="token-logo bnb">◆</span><strong>BNB</strong><span>⌄</span></div>
        <div class="numbers"><strong>0.01</strong><small>≈ 6,247.70 USD</small></div>
      </div>
    </section>

    <button class="switch" aria-label="Switch tokens">↕</button>

    <section class="swap-card receive">
      <div class="label-line"><span>You Receive</span><span class="balance">▣ 187.52 USDT</span></div>
      <div class="token-line">
        <div class="token"><span class="token-logo usdt">₮</span><strong>USDT</strong><span>⌄</span></div>
        <div class="numbers"><strong>6.7345108344</strong><small>≈ 28,197.64 USD</small></div>
      </div>
    </section>

    <div class="details"><div>🔥 Fee: <b>0.255851 USDT</b>⌄</div><div><i></i> 1 BNB = 673.45108 (198,98 USD)</div></div>
    <div class="slider"><button id="handle">⌄</button><span id="sliderText">Slide to Swap</span><b>››</b></div>
    <div class="powered">powered by <b>kima</b></div>

    <nav>
      <a><span>◉</span>Stake</a><a><span>✣</span>Portfolio</a><a class="selected"><strong>↕</strong>Swap</a><a><span>▥</span>Liquidity</a><a><span>⬡</span>Settings</a>
    </nav>
  </main>
  <script src="script.js"></script>
</body>
</html>
