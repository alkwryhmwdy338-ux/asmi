<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Icons</title><style>body{font-family:Arial;background:#eee;padding:20px}.icon{background:#fff;border-radius:14px;padding:20px;margin:10px 0}svg{width:48px;height:48px}</style></head>
<body><div id="icons"></div><script type="module">
import {icon as home} from './icons/home.js';
import {icon as swap} from './icons/swap.js';
import {icon as wallet} from './icons/wallet.js';
import {icon as search} from './icons/search.js';
import {icon as close} from './icons/close.js';
import {icon as settings} from './icons/settings.js';
import {icon as liquidity} from './icons/liquidity.js';
import {icon as portfolio} from './icons/portfolio.js';
import {icon as stake} from './icons/stake.js';
const list={home,swap,wallet,search,close,settings,liquidity,portfolio,stake};
for(const [name,svg] of Object.entries(list)){const d=document.createElement('div');d.className='icon';d.innerHTML='<b>'+name+'</b><br>'+svg;document.querySelector('#icons').append(d)}
</script></body></html>
