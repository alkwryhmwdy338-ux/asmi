<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent}
body{background:#dfe6f8}
main{min-height:100vh;padding-bottom:105px}
.content{height:calc(100vh - 105px);display:grid;place-items:center;font-size:46px;font-weight:700;color:#111}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:105px;padding:8px 24px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:#dfe6f8;z-index:10}
.nav-item{height:82px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;text-decoration:none;color:#9ca5b7;font-size:15px;font-weight:500;line-height:1}
.nav-item.active{color:#111}.nav-item:focus,.nav-item:active{outline:none;background:transparent;-webkit-tap-highlight-color:transparent}
.nav-item>svg{width:32px;height:32px;display:block}
.swap-circle{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:-1px}
.swap-circle svg{width:34px;height:34px;display:block}
@media(max-width:380px){.bottom-nav{padding-left:10px;padding-right:10px}.nav-item{font-size:13px}.swap-circle{width:58px;height:58px}}
</style>
</head>
<body>
<main>
<section class="content">Swap</section>
<nav class="bottom-nav"><a class="nav-item " href="stake.html"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#9ca5b7"/><path d="M16 8.5 23.5 16 16 23.5 8.5 16Z" fill="#dfe6f8"/></svg><span>Stake</span></a><a class="nav-item " href="portfolio.html"><svg viewBox="0 0 32 32"><circle cx="16" cy="7" r="5" fill="#9ca5b7"/><circle cx="9" cy="20" r="5" fill="#9ca5b7"/><circle cx="23" cy="20" r="5" fill="#9ca5b7"/></svg><span>Portfolio</span></a><a class="nav-item active" href="swap.html"><span class="swap-circle"><svg viewBox="0 0 34 34"><path d="M10 7v14l-3-3-2 2 6 6 6-6-2-2-3 3V7Z" fill="#111"/><path d="M24 27V13l3 3 2-2-6-6-6 6 2 2 3-3v14Z" fill="#111"/></svg></span><span>Swap</span></a><a class="nav-item " href="liquidity.html"><svg viewBox="0 0 32 32"><rect x="4" y="14" width="6" height="14" rx="3" fill="#9ca5b7"/><rect x="13" y="5" width="6" height="23" rx="3" fill="#9ca5b7"/><rect x="22" y="10" width="6" height="18" rx="3" fill="#9ca5b7"/></svg><span>Liquidity</span></a><a class="nav-item " href="settings.html"><svg viewBox="0 0 32 32"><path d="M10 3.5h12L28.5 10v12L22 28.5H10L3.5 22V10Z" fill="#9ca5b7"/><circle cx="16" cy="16" r="5" fill="#dfe6f8"/></svg><span>Settings</span></a></nav>
</main>
</body>
</html>
