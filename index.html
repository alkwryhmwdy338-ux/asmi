<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="profile">A</div>
    <div class="wallet"><b>0x8A...4F21</b><span>Wallet connected</span></div>
    <button class="icon-btn">♧</button>
  </header>

  <main>
    <h1>Swap</h1>
    <p class="subtitle">Exchange your assets quickly and securely</p>

    <section class="swap-card">
      <div class="small-row"><span>You pay</span><span>Balance 0.00</span></div>
      <div class="asset-row">
        <button class="asset">
          <span class="coin bnb">◆</span><b>BNB</b><span>⌄</span>
        </button>
        <input id="pay" type="number" min="0" step="any" value="0">
      </div>
    </section>

    <button id="reverse" class="reverse">↓</button>

    <section class="swap-card">
      <div class="small-row"><span>You receive</span><span>Estimated</span></div>
      <div class="asset-row">
        <button class="asset">
          <span class="coin usdt">₮</span><b>USDT</b><span>⌄</span>
        </button>
        <input id="receive" value="0" readonly>
      </div>
    </section>

    <section class="details">
      <div><span>Rate</span><b>1 BNB ≈ 600 USDT</b></div>
      <div><span>Network fee</span><b>~0.0005 BNB</b></div>
      <div><span>Slippage</span><b>0.5%</b></div>
    </section>

    <button id="swap" class="swap-button">Slide to Swap <span>→</span></button>
    <div class="powered">powered by <b>kima</b></div>
  </main>

  <nav>
    <a href="#"><span>⌂</span>Home</a>
    <a class="active" href="#"><span>⇄</span>Swap</a>
    <a href="#"><span>◈</span>Assets</a>
    <a href="#"><span>↻</span>History</a>
    <a href="#"><span>⚙</span>Settings</a>
  </nav>
</div>
<script src="script.js"></script>
</body>
</html>
