<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="avatar">A</div>
      <div class="wallet">
        <strong>0x8A...4F21</strong>
        <span>Wallet connected</span>
      </div>
      <button class="wallet-btn" aria-label="Wallet">
        <svg viewBox="0 0 24 24"><path d="M4 7.5h14.5A2.5 2.5 0 0 1 21 10v8a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h12"/><path d="M17 12h4v4h-4a2 2 0 1 1 0-4Z"/></svg>
      </button>
    </header>

    <section class="content">
      <h1>Swap</h1>
      <p class="subtitle">Exchange your assets quickly and securely</p>

      <section class="swap-card">
        <div class="card-label"><span>You pay</span><span>Balance 0.00</span></div>
        <div class="token-row">
          <button class="token">
            <span class="coin bnb">◆</span><b>BNB</b><span class="chev">⌄</span>
          </button>
          <input id="pay" inputmode="decimal" value="0" aria-label="Amount to pay">
        </div>
      </section>

      <button class="switch" id="switchBtn" aria-label="Switch tokens">
        <svg viewBox="0 0 24 24"><path d="M7 4v12m0 0-4-4m4 4 4-4M17 20V8m0 0-4 4m4-4 4 4"/></svg>
      </button>

      <section class="swap-card">
        <div class="card-label"><span>You receive</span><span>Estimated</span></div>
        <div class="token-row">
          <button class="token">
            <span class="coin usdt">₮</span><b>USDT</b><span class="chev">⌄</span>
          </button>
          <input id="receive" inputmode="decimal" value="0" aria-label="Estimated amount">
        </div>
      </section>

      <section class="details">
        <div><span>Rate</span><b>1 BNB ≈ 600 USDT</b></div>
        <div><span>Network fee</span><b>~0.0005 BNB</b></div>
        <div><span>Slippage</span><b>0.5%</b></div>
      </section>

      <button class="swap-action" id="swapAction">Swap</button>
    </section>

    <nav class="bottom-nav">
      <button><span class="nav-icon">⌂</span><span>Home</span></button>
      <button class="active"><span class="nav-icon">⇄</span><span>Swap</span></button>
      <button><span class="nav-icon">◇</span><span>Assets</span></button>
      <button><span class="nav-icon">↻</span><span>History</span></button>
      <button><span class="nav-icon">⚙</span><span>Settings</span></button>
    </nav>
  </main>
  <script src="script.js"></script>
</body>
</html>
