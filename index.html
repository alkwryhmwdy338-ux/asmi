<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icons Only</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f8;font-family:Arial,sans-serif;color:#333}.wrap{max-width:700px;margin:auto;padding:24px}.title{font-size:24px;font-weight:700;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 2px 10px #0001}.item svg{width:52px;height:52px;display:block;margin:0 auto 10px}.name{font-size:14px;color:#777;direction:ltr}.error{padding:16px;background:#fff3f3;color:#a00;border-radius:12px;display:none;margin-top:15px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap"><div class="title">الأيقونات</div><div id="icons" class="grid"></div><div id="error" class="error"></div></div>
<script src="icons/home.js"></script><script src="icons/swap.js"></script><script src="icons/wallet.js"></script><script src="icons/search.js"></script><script src="icons/close.js"></script><script src="icons/settings.js"></script><script src="icons/liquidity.js"></script><script src="icons/portfolio.js"></script><script src="icons/stake.js"></script>
<script>
(function(){
 const names=['home','swap','wallet','search','close','settings','liquidity','portfolio','stake'];
 const box=document.getElementById('icons');
 names.forEach(function(n){
   const svg=window.ICONS&&window.ICONS[n];
   if(!svg) return;
   const d=document.createElement('div'); d.className='item';
   d.innerHTML=svg+'<div class="name">'+n+'.js</div>'; box.appendChild(d);
 });
 if(!box.children.length){const e=document.getElementById('error');e.style.display='block';e.textContent='لم يتم تحميل ملفات الأيقونات. تأكد أن مجلد icons موجود بجانب index.html.';}
})();
</script>
</body></html>
