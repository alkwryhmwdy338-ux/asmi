<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <!-- Status Bar -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <span class="icon-signal"></span>
        <span class="icon-wifi"></span>
        <span class="icon-battery"></span>
      </div>
    </div>

    <!-- Browser Bar -->
    <div class="browser-bar">
      <button class="btn-menu">☰</button>
      <button class="btn-add">+</button>
      <div class="url-bar">fbcgol.com</div>
      <button class="btn-home">⌂</button>
    </div>

    <!-- App Content -->
    <main class="app">
      <!-- Profile Section -->
      <div class="profile-section">
        <div class="avatars">
          <div class="avatar avatar-1"></div>
          <div class="avatar avatar-2">8</div>
          <div class="avatar avatar-3">C</div>
        </div>
        <div class="wallet-info">
          <span>0xfK07...8336</span>
          <span class="dropdown">▾</span>
        </div>
        <button class="wallet-icon">📱</button>
      </div>

      <!-- Tools -->
      <div class="tools">
        <button class="tool-btn search">🔍</button>
        <button class="tool-btn close">✕</button>
      </div>

      <!-- Title -->
      <h1>Swap</h1>

      <!-- Pay Card -->
      <div class="card pay-card">
        <div class="card-header">
          <span>You Pay</span>
          <div class="balance">📦 52.34 BNB <button class="max-btn">Max</button></div>
        </div>
        <div class="token-row">
          <div class="token">
            <div class="token-logo bnb">◆</div>
            <span class="name">BNB</span>
            <span class="dropdown">▾</span>
          </div>
          <div class="amount-box">
            <div class="amount">0.01</div>
            <div class="usd">≈ 6,247.70 USD</div>
          </div>
        </div>
      </div>

      <!-- Swap Button -->
      <button class="swap-button" onclick="swapTokens()">⇅</button>

      <!-- Receive Card -->
      <div class="card receive-card">
        <div class="card-header">
          <span>You Receive</span>
          <div class="balance receive">📦 187.52 USDT</div>
        </div>
        <div class="token-row">
          <div class="token">
            <div class="token-logo usdt">₮</div>
            <span class="name">USDT</span>
            <span class="dropdown">▾</span>
          </div>
          <div class="amount-box">
            <div class="amount">6.7345108344</div>
            <div class="usd">≈ 28,197.64 USD</div>
          </div>
        </div>
      </div>

      <!-- Fee Info -->
      <div class="fee-info">
        🔥 Fee: <strong>0.255851 USDT</strong> ▾
      </div>

      <!-- Slider -->
      <div class="slider">
        <button class="slider-handle" id="sliderHandle">⬆</button>
        <span class="slider-text" id="sliderText">Slide to Swap</span>
        <span class="slider-arrows">>></span>
      </div>

      <!-- Footer -->
      <div class="footer">powered by <strong>kima</strong></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
