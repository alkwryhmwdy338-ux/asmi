<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swap</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent}
body{background:#dfe6f8}
main{min-height:100vh;padding-bottom:105px}
.content{height:calc(100vh - 105px);display:flex;justify-content:center;align-items:flex-start;font-size:46px;font-weight:700;color:#111;overflow:auto}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:105px;padding:8px 24px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:#dfe6f8;z-index:10}
.nav-item{height:82px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;text-decoration:none;color:#9ca5b7;font-size:15px;font-weight:500;line-height:1}
.nav-item.active{color:#111}.nav-item:focus,.nav-item:active{outline:none;background:transparent;-webkit-tap-highlight-color:transparent}
.nav-item>svg{width:32px;height:32px;display:block}
.swap-circle{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:-1px}
.swap-circle svg{width:34px;height:34px;display:block}
@media(max-width:380px){.bottom-nav{padding-left:10px;padding-right:10px}.nav-item{font-size:13px}.swap-circle{width:58px;height:58px}}

.swap-page{width:100%;display:flex;flex-direction:column;align-items:center;gap:34px;padding:24px 18px 0}
.balance-card{width:min(92vw,520px);min-height:245px;border-radius:28px;background:linear-gradient(145deg,#25282d,#0c0e11);color:#fff;padding:20px 22px 18px;box-shadow:0 12px 28px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.16);position:relative}
.wallet-pill{width:max-content;margin:0 auto 10px;padding:8px 14px;border-radius:18px;background:#363a40;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}
.wallet-mini{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:0 0 42px;overflow:hidden;margin-left:-7px;margin-right:-2px;border-radius:50%}
.wallet-mini img{width:42px;height:42px;object-fit:contain;display:block}
.balance-label{text-align:center;color:#aeb4bf;font-size:14px;margin-top:2px}
.balance-amount{text-align:center;font-size:38px;font-weight:700;letter-spacing:.3px;margin:3px 0 16px}
.balance-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.balance-action{display:flex;flex-direction:column;align-items:center;gap:7px;color:#b5bbc5;font-size:14px;font-weight:700;font-family:"Noto Sans Arabic","Noto Kufi Arabic","Tajawal","Cairo",sans-serif;line-height:1.25;font-weight:800;letter-spacing:-.2px;text-rendering:optimizeLegibility}
.action-circle{width:44px;height:44px;border-radius:50%;background:#247cff;color:#fff;display:grid;place-items:center;font-size:25px;line-height:1}
.action-circle.history{font-size:19px}
.mastercard-logo{position:absolute;left:56px;top:82px;width:92px;height:58px;display:block;z-index:2}
.mastercard-logo i,.mastercard-logo b{position:absolute;top:8px;width:48px;height:48px;border-radius:50%;display:block}
.mastercard-logo i{left:0;background:#f20d1b}.mastercard-logo b{left:34px;background:#f6a21a}
@media(max-width:380px){
 .balance-card{min-height:225px;padding:16px 14px}
 .balance-amount{font-size:34px}
 .action-circle{width:40px;height:40px}
 .balance-action{font-size:11px}
 .swap-page{padding-top:14px}
 .mastercard-logo{left:34px;top:72px;width:78px;height:50px}
}
</style>
</head>
<body>
<main>
<section class="content">
  <div class="swap-page">
    <div class="balance-card">
      <div class="wallet-pill">
        <span class="wallet-mini" aria-hidden="true"><svg viewBox="0 0 64 64" width="42" height="42"><circle cx="32" cy="32" r="31" fill="#247cff"/><path d="M20 12h18l10 10v30H20z" fill="#fff"/><path d="M38 12v12h10" fill="#dfe8ff"/><path d="M27 29h14M27 36h14M27 43h10" stroke="#247cff" stroke-width="3" stroke-linecap="round"/></svg></span>
        <span>**** 6780</span>
      </div>
      <span class="mastercard-logo" aria-label="Mastercard"><i></i><b></b></span>
      <div class="balance-label">My Balance</div>
      <div class="balance-amount">$00.00</div>
      <div class="balance-actions">
        <div class="balance-action"><span class="action-circle">+</span><span>شحن</span></div>
        <div class="balance-action"><span class="action-circle">↗</span><span>سحب</span></div>
        <div class="balance-action"><span class="action-circle">↙</span><span>حدث</span></div>
        <div class="balance-action"><span class="action-circle history">▣</span><span>تحديث</span></div>
      </div>
    </div>
  </div>
</section>
<nav class="bottom-nav"><a class="nav-item " href="stake.html"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#9ca5b7"/><path d="M16 8.5 23.5 16 16 23.5 8.5 16Z" fill="#dfe6f8"/></svg><span>Stake</span></a><a class="nav-item " href="portfolio.html"><svg viewBox="0 0 32 32"><circle cx="16" cy="7" r="5" fill="#9ca5b7"/><circle cx="9" cy="20" r="5" fill="#9ca5b7"/><circle cx="23" cy="20" r="5" fill="#9ca5b7"/></svg><span>Portfolio</span></a><a class="nav-item active" href="swap.html"><span class="swap-circle"><svg viewBox="0 0 34 34"><path d="M10 7v14l-3-3-2 2 6 6 6-6-2-2-3 3V7Z" fill="#111"/><path d="M24 27V13l3 3 2-2-6-6-6 6 2 2 3-3v14Z" fill="#111"/></svg></span><span>Swap</span></a><a class="nav-item " href="liquidity.html"><svg viewBox="0 0 32 32"><rect x="4" y="14" width="6" height="14" rx="3" fill="#9ca5b7"/><rect x="13" y="5" width="6" height="23" rx="3" fill="#9ca5b7"/><rect x="22" y="10" width="6" height="18" rx="3" fill="#9ca5b7"/></svg><span>Liquidity</span></a><a class="nav-item " href="settings.html"><svg viewBox="0 0 32 32"><path d="M10 3.5h12L28.5 10v12L22 28.5H10L3.5 22V10Z" fill="#9ca5b7"/><circle cx="16" cy="16" r="5" fill="#dfe6f8"/></svg><span>Settings</span></a></nav>
</main>
</body>
</html>
