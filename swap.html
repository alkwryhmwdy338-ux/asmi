<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Swap</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent;background:#dfe6f8}
body{overflow-x:hidden}
main{min-height:100vh;padding-bottom:105px}
.swap-page{min-height:calc(100vh - 105px);padding:18px 22px 24px;overflow:hidden}
.swap-title{margin:0 0 18px;text-align:center;font-size:38px;line-height:1.05;font-weight:700;color:#111}
.swap-wrap{position:relative;width:100%;max-width:620px;margin:0 auto}
.swap-card{position:relative;background:#fff;border-radius:40px;overflow:hidden}
.pay-card{height:250px;padding:30px 38px 20px}
.receive-card{height:285px;margin-top:11px;padding:24px 38px 10px}
.swap-label{color:#7c899b;font-size:21px;font-weight:500}
.balance{position:absolute;right:26px;top:28px;display:flex;align-items:center;gap:8px;color:#7c899b;font-size:18px;white-space:nowrap}
.wallet-icon{width:27px;height:21px;border-radius:6px;background:#8995a5;position:relative;display:inline-block}
.wallet-icon:after{content:"";position:absolute;right:4px;top:7px;width:6px;height:6px;border-radius:50%;background:#dfe6f8}
.max{border:0;background:#050505;color:white;font-weight:700;font-size:18px;padding:11px 17px;border-radius:24px;margin-left:4px}
.pay-content{position:absolute;left:55px;right:48px;top:86px;bottom:16px;display:flex;align-items:center;justify-content:space-between}
.pay-image{width:180px;height:145px;object-fit:contain;mix-blend-mode:multiply}
.pay-right{display:flex;align-items:center;gap:20px}
.mastercard{width:92px;height:72px;object-fit:contain}
.amount{text-align:right;color:#080808}
.amount-main{font-size:54px;line-height:.95;font-weight:700;letter-spacing:-1px}
.amount-usd{margin-top:9px;font-size:22px;color:#7c899b}
.amount-usd strong{font-size:43px;color:#080808;line-height:1}
.amount-usd span{margin-left:7px}
.swap-middle{position:absolute;z-index:4;left:50%;top:250px;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#e9edf8;display:grid;place-items:center}
.swap-middle svg{width:43px;height:43px}
.receive-image{display:block;width:285px;height:175px;object-fit:contain;margin:2px auto 0;mix-blend-mode:multiply}
.info{text-align:center;margin-top:14px}
.fee{font-size:18px;color:#7c899b}
.fee b{color:#111}
.rate{font-size:16px;color:#7c899b;margin-top:12px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:105px;padding:8px 24px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:#dfe6f8;z-index:10}
.nav-item{height:82px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;text-decoration:none;color:#9ca5b7;font-size:15px;font-weight:500;line-height:1}
.nav-item.active{color:#111}
.nav-item:focus,.nav-item:active{outline:none;background:transparent;-webkit-tap-highlight-color:transparent}
.nav-item>svg{width:32px;height:32px;display:block}
.swap-circle{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:-1px}
.swap-circle svg{width:34px;height:34px;display:block}
@media(max-width:520px){
 .swap-page{padding-left:22px;padding-right:22px}
 .swap-title{font-size:34px;margin-bottom:18px}
 .pay-card{height:245px;padding:28px 28px 16px;border-radius:38px}
 .receive-card{height:275px;padding:22px 28px 8px;border-radius:38px}
 .swap-label{font-size:20px}
 .balance{right:22px;top:27px;font-size:16px;gap:6px}
 .wallet-icon{width:24px;height:19px}
 .max{font-size:16px;padding:10px 15px}
 .pay-content{left:40px;right:32px;top:82px}
 .pay-image{width:145px;height:125px}
 .pay-right{gap:10px}
 .mastercard{width:70px;height:58px}
 .amount-main{font-size:46px}
 .amount-usd{font-size:19px}
 .amount-usd strong{font-size:34px}
 .swap-middle{top:245px;width:72px;height:72px}
 .receive-image{width:245px;height:155px;margin-top:0}
}
@media(max-width:380px){
 .bottom-nav{padding-left:10px;padding-right:10px}
 .nav-item{font-size:13px}
 .swap-circle{width:58px;height:58px}
 .pay-card{height:230px;padding-left:22px;padding-right:22px}
 .receive-card{height:255px;padding-left:22px;padding-right:22px}
 .pay-content{left:27px;right:20px}
 .pay-image{width:125px;height:105px}
 .mastercard{width:60px;height:48px}
 .amount-main{font-size:40px}
 .amount-usd strong{font-size:29px}
 .balance{font-size:14px;right:16px}
 .max{font-size:14px;padding:9px 13px}
}
</style>
</head>
