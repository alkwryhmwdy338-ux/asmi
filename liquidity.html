<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Liquidity</title><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#dfe6f8}
body{padding-bottom:120px}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#dfe6f8}
.header-left{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#ccc;position:relative}
.badge{position:absolute;bottom:-4px;right:-4px;width:24px;height:24px;background:#ff6b6b;border:2px solid white;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:bold}
.wallet-addr{display:flex;align-items:center;gap:6px;font-weight:600;color:#111;font-size:14px}
.wallet-icon{width:20px;height:20px;background:#1e88e5;border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:bold}
.header-right{display:flex;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#333;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:18px}
.main-content{padding:20px;text-align:center;padding-top:100px}
.title{font-size:48px;font-weight:700;color:#111;margin-bottom:30px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:100px;background:white;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9ca5b7;font-size:12px;font-weight:500;text-decoration:none;cursor:default}
.nav-item.active{color:#111}
.nav-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px}
</style></head><body>
<div class="header">
<div class="header-left">
<div class="avatar"><div class="badge">8</div></div>
<div class="wallet-addr"><div class="wallet-icon">C</div>0xfK07...8336<span style="color:#9ca5b7;font-size:12px">▼</span></div>
</div>
<div class="header-right">
<button class="icon-btn" style="background:#444">🔍</button>
<button class="icon-btn">✕</button>
</div>
</div>

<div class="main-content">
<div class="title">Liquidity</div>
</div>

<nav class="bottom-nav">
<div class="nav-item">
<div class="nav-icon">⚙️</div>
<span>Stake</span>
</div>
<div class="nav-item">
<div class="nav-icon">◈</div>
<span>Portfolio</span>
</div>
<div class="nav-item">
<div class="nav-icon">⇅</div>
<span>Swap</span>
</div>
<div class="nav-item active">
<div class="nav-icon">📊</div>
<span>Liquidity</span>
</div>
<div class="nav-item">
<div class="nav-icon">⚙️</div>
<span>Settings</span>
</div>
</nav>
</body></html>
